services:
  postgres:
    image: postgres:16-alpine
    container_name: danay-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: danay_express
      POSTGRES_USER: danay
      POSTGRES_PASSWORD: ${DB_PASSWORD:-danay_dev_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U danay -d danay_express"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: danay-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: danay-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: danay_express
      DB_USER: danay
      DB_PASSWORD: ${DB_PASSWORD:-danay_dev_password}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:?la variable JWT_SECRET doit être définie en production}
    ports:
      - "8081:8080"

volumes:
  postgres_data:
