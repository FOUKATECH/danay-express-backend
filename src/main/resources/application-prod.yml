spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${DB_NAME:danay_express}
    username: ${DB_USER:danay}
    password: ${DB_PASSWORD:}

  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}

  jpa:
    show-sql: false

logging:
  level:
    root: WARN
    cm.danayexpress.backend: INFO
